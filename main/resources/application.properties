# JPA Configuration
# Use 'update' for auto-creating tables, 'validate' for production
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Use custom naming strategy to preserve case sensitivity
spring.jpa.properties.hibernate.physical_naming_strategy=com.quadgrimoire.config.CaseSensitiveNamingStrategy

# Session Configuration
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=86400
