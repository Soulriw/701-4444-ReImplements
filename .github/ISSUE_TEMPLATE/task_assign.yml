name: Task
description: Create a new task to be completed
labels: [task]

body:
  - type: markdown
    attributes:
      value: |
        ## Task Details
        Please provide information about the task to be completed.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What needs to be done?"
      placeholder: "Provide details about the task..."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Critical
      default: 1
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: "This task is clearly defined with realistic acceptance criteria"
          required: true